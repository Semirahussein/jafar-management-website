spring.application.name=jafar-management-system
app.time-zone=${APP_TIME_ZONE:Africa/Addis_Ababa}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jafar_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:jafar_user}
spring.datasource.password=${DB_PASSWORD:jafar_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin}
app.session.cookie-secure=${SESSION_COOKIE_SECURE:true}
app.security.remember-me-key=${REMEMBER_ME_KEY:}

logging.level.org.springframework.security=INFO
logging.level.com.jafar.management=INFO
