# Isolated, disposable runtime database profile for Playwright E2E tests.
# Activate with SPRING_PROFILES_ACTIVE=e2e (or --spring.profiles.active=e2e).
# This NEVER touches the real MySQL "jafar_management" database - it boots a fresh,
# in-memory H2 instance (MySQL compatibility mode) that is created on startup and
# discarded on shutdown (ddl-auto=create-drop). Distinct DB name ("jafar_e2e") from
# the "test" profile's "jafar_test" so the two can never collide if ever run together.
spring.datasource.url=jdbc:h2:mem:jafar_e2e;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.bootstrap-admin.username=admin
app.bootstrap-admin.password=admin1234
app.time-zone=Africa/Addis_Ababa
app.session.cookie-secure=false
server.servlet.session.cookie.secure=false

logging.level.org.springframework.security=WARN
logging.level.com.jafar.management=WARN
